[project]
name = "grasp-workbench"
version = "0.3.0"
description = "RealSense RGB-D capture and repeatable inference workbench for grasp models"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["numpy>=1.26", "opencv-python>=4.9", "streamlit>=1.38", "pillow>=10", "pyyaml>=6"]

[project.optional-dependencies]
torch = ["torch>=2.2"]
realsense = ["pyrealsense2>=2.55"]
dev = ["pytest>=8", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grasp_workbench"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
